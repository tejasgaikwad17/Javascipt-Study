<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Idicator</title>
</head>
<body>
    <h3>BMI Calculator</h3>
    <form action="">

        <label for="">Height in CM : </label>
        <input type="text" id="height">
        <br><br>
        <label for="">Weight in KG : </label>
        <input type="text" id="weight">
        <br><br>
        <div id="results" ></div>
        <button     >Calculate</button>

    </form>

    <h4>BMI Weight Guide</h4>
    <p>Under weight = Less than 18.6</p>
    <p>Normal Range = 18.6 and 24.9</p>
    <p>Overweight = Greater than 24.9</p>

</body>

<script>
    const form = document.querySelector('form')

    form.addEventListener('submit', function(e){
        e.preventDefault();

        const height = parseInt(document.querySelector('#height').value)
        const weight = parseInt(document.querySelector('#weight').value)
        const result = document.querySelector('#results')

        if(height === 0 || height < 0 || isNaN(height)){
            results.innerHTML = `Please give a valid height ${height}`
        }
        else if(weight === 0 || weight < 0 || isNaN(weight)){
            results.innerHTML = `Please give a valid weight ${weight}`
        }else{
            const bmi = (weight / ((height / 100) ** 2)).toFixed(2);
            results.innerHTML = `<span style = "color : red; margin-bottom: 32px ;">Your BMI is ${bmi}</span>`
        }


    })

</script>
</html>
